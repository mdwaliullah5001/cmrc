<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="yellowBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Inner White Card -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Book Spine & Pages -->
  <g transform="translate(100, 110)">
    <!-- Book Cover (Yellow Book) -->
    <rect x="0" y="0" width="312" height="292" rx="24" fill="url(#yellowBook)" filter="url(#shadow)"/>
    <rect x="0" y="0" width="48" height="292" rx="12" fill="#ca8a04"/>
    
    <!-- White Pages Edge -->
    <path d="M 48 24 L 296 24 C 304 24 308 28 308 36 L 308 268 C 308 276 304 280 296 280 L 48 280 Z" fill="#fefce8"/>
    
    <!-- Lines on Page representing clauses -->
    <rect x="74" y="60" width="160" height="14" rx="7" fill="#854d0e"/>
    <rect x="74" y="90" width="200" height="8" rx="4" fill="#a16207" opacity="0.7"/>
    <rect x="74" y="112" width="180" height="8" rx="4" fill="#a16207" opacity="0.7"/>
    <rect x="74" y="134" width="190" height="8" rx="4" fill="#a16207" opacity="0.7"/>
    
    <!-- Badge / Stamp: "FIDIC" & Bengali letter "ক্লজ" -->
    <rect x="74" y="170" width="140" height="72" rx="12" fill="#14532d"/>
    <text x="144" y="200" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#86efac" text-anchor="middle">FIDIC</text>
    <text x="144" y="226" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">বাংলা</text>
  </g>
</svg>
